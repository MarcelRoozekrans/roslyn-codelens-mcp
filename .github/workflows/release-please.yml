name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          # npm >= 11.5.1 is required for trusted publishing (OIDC); Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Restore test fixtures
        run: dotnet restore tests/RoslynCodeLens.Tests/Fixtures/TestSolution/TestSolution.slnx

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/RoslynCodeLens/RoslynCodeLens.csproj -c Release --no-build -p:PackageVersion=${{ needs.release-please.outputs.version }} -o ./nupkg

      - name: Push to NuGet
        # No --skip-duplicate: if the release version already exists on NuGet, fail loudly
        # rather than silently masking a version collision (see #225).
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      # The npm package is a launcher that installs the NuGet tool at a matching
      # version, so it must be published after the NuGet push, never before.
      # Trusted publishing (OIDC) — no NODE_AUTH_TOKEN; uses the workflow-level
      # `id-token: write` permission.
      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public

      - name: Upload to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./nupkg/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        # The registry validates the version against NuGet's search index, which for a
        # NEW version can lag 5-15+ min behind the upload the `publish` job just did
        # (new versions index far slower than updates to an existing package). The old
        # 6x30s (~3 min) window was too short and failed the release on indexing lag
        # (2.4.2). Retry with backoff over a ~25 min window so we ride it out.
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          max_attempts=15
          delay=30
          for attempt in $(seq 1 "$max_attempts"); do
            if ./mcp-publisher publish; then
              echo "Published $VERSION to MCP Registry on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::notice::MCP Registry publish attempt $attempt/$max_attempts failed (NuGet is likely still indexing $VERSION); retrying in ${delay}s"
              sleep "$delay"
              # Ramp up to a 2 min cap so the total window is ~25 min without hammering.
              [ "$delay" -lt 120 ] && delay=$((delay + 30))
            fi
          done
          echo "::error::MCP Registry publish failed after $max_attempts attempts (~25 min). NuGet may still be indexing $VERSION; once nuget.org shows it, re-run the 'Publish to MCP Registry' workflow (Actions -> Publish to MCP Registry -> Run workflow)."
          exit 1
